[package]
name = "hermes-watch"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Read-only watcher for a Hermes Agent state.db: produces HermesSnapshot for hermes-buddy"

[dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[dev-dependencies]
tempfile = "3"
