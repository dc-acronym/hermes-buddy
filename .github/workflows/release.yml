# macOS DMG release: builds a universal (Apple Silicon + Intel) DMG.
#
#   push to the `release` branch → publishes release v<version> (version from tauri.conf.json);
#                                  GitHub creates the tag, so nobody has to push one
#   push a tag like v0.1.0       → publishes a release for that tag
#   Actions → Run workflow       → just builds; the DMG is the run's artifact, no release
#
# The app is ad-hoc signed (APPLE_SIGNING_IDENTITY "-"), not Developer ID signed or notarized, so
# first launch needs the quarantine step in the README.
name: Release (macOS DMG)

on:
  push:
    branches: [release]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dmg:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Unit tests
        working-directory: app
        run: npm test

      - name: Build DMG (and publish the release on tags)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: "-"
        with:
          projectPath: app
          args: --target universal-apple-darwin --bundles dmg
          # Tag push → that tag; release branch → v<version>, tag created with the release
          # (tauri-action fills in __VERSION__); manual run → '' = build only, no release.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || (github.ref == 'refs/heads/release' && 'v__VERSION__' || '') }}
          releaseName: Hermes Buddy v__VERSION__
          releaseDraft: false
          prerelease: false
          releaseBody: |
            Universal macOS build (Apple Silicon + Intel). Download the `.dmg`, open it, drag **Hermes Buddy** to Applications.

            It isn't signed with an Apple Developer ID or notarized, so macOS blocks the first launch
            ("can't be opened" or "is damaged"). Clear the quarantine flag once:

            ```bash
            /usr/bin/xattr -dr com.apple.quarantine "/Applications/Hermes Buddy.app"
            ```

            Or: open it once, then System Settings → Privacy & Security → **Open Anyway**.
            Full notes in the README.

      - name: Upload DMG artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: hermes-buddy-macos-dmg
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
